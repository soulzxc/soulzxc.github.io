<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>мейкапцелы кругом</title>
    
    <style>
        @font-face {
            font-family: 'ColumbiaRandom';
            src: url('ColumbiaRandom BoldItalic.ttf') format('truetype');
            font-weight: bold;
            font-style: italic;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- Стили основного профиля --- */
        body {
            background-color: #050505;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 50% 20%, #161616 0%, #050505 100%);
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .container.visible {
            opacity: 1;
        }

        .card {
            background: rgba(14, 14, 14, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .banner {
            width: calc(100% + 48px);
            height: 100px;
            margin: -24px -24px 16px -24px;
            background: linear-gradient(135deg, #1f1f1f 0%, #080808 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
        }

        .views {
            position: absolute;
            top: 12px;
            right: 14px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #999;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .avatar {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: #1a1a1a;
            border: 2px solid rgba(255, 255, 255, 0.12);
            object-fit: cover;
            margin-top: -50px;
            margin-bottom: 12px;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .nickname {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .bio-text {
            font-size: 13px;
            color: #888;
            margin-bottom: 18px;
        }

        .links-stack {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }

        .bio-link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 16px;
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .bio-link-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .bio-link-btn span {
            color: #666;
            font-size: 12px;
        }

        .player-card {
            background: rgba(14, 14, 14, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .player-card:hover {
            background: rgba(20, 20, 20, 0.8);
        }

        .player-thumb {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            object-fit: cover;
        }

        .player-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .track-name {
            font-size: 12px;
            font-weight: 600;
            color: #ddd;
        }

        .track-progress {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .track-progress-fill {
            width: 0%;
            height: 100%;
            background: #fff;
            border-radius: 3px;
            pointer-events: none;
        }

        /* --- Стили нового Splash Screen (L Aesthetic) --- */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0b0b0b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #splashScreen.fade-out {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        .splash-content {
            text-align: center;
            position: relative;
        }

        .avatar-frame {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #222, #000);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8),
                        inset 0 0 15px rgba(255, 255, 255, 0.05);
            animation: float 4s ease-in-out infinite;
        }

        .avatar-frame::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ffffff, #333333, #000000);
            z-index: -1;
            opacity: 0.3;
            filter: blur(8px);
            animation: pulse-glow 3s ease-in-out infinite alternate;
        }

        .splash-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            filter: grayscale(20%) contrast(110%);
        }

        .tag {
            margin-top: 25px;
            color: #888;
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse-glow {
            0% { opacity: 0.2; transform: scale(0.98); }
            100% { opacity: 0.5; transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <!-- Новый Splash Screen -->
    <div id="splashScreen">
        <div class="splash-content">
            <div class="avatar-frame">
                <img src="https://i.pinimg.com/originals/27/62/de/2762de2125aaabbbb2d3a2c07b9445f5.gif" alt="Splash Avatar" class="splash-avatar">
            </div>
            <!-- Добавил тег CLICK TO LARP из твоего CSS -->
            <div class="tag">Akame ga Kill (ⲥⳑⲓⲥⲕ ⲏⲉʀⲉ)</div>
        </div>
    </div>

    <!-- Основной контент (карточка, кнопки, плеер) -->
    <div class="container" id="mainContainer">
        <div class="card">
            <div class="banner">
                <div class="views">👁 998</div>
            </div>

            <img src="https://s6.iimage.su/s/04/gziUqFPxdr8T7ZrtYZsHbqGmU8TMLfV5VGjAEwfEZ.jpg" alt="Avatar" class="avatar">
            <div class="nickname">мейкапцелы</div>
            <div class="bio-text">шинамы</div>
            
            <div class="links-stack">
                <a href="https://t.me/menli" class="bio-link-btn" onclick="window.open('https://t.me/menli', '_blank'); return false;">
                    Telegram (press) <span>@menli</span>
                </a>
                <a href="https://t.me/themacedon" class="bio-link-btn" onclick="window.open('https://t.me/themacedon'', '_blank'); return false;">
                    TG Group <span>aftermath @menli</span>
                </a>
                <a href="https://t.me/liblerage" class="bio-link-btn" onclick="window.open('https://t.me/liblerage', '_blank'); return false;">
                    Channel (press) <span>сун огiнськiй</span>
                </a>
            </div>
        </div>

        <div class="player-card" id="playBtn">
            <img src="https://s6.iimage.su/s/04/gziUqFPxdr8T7ZrtYZsHbqGmU8TMLfV5VGjAEwfEZ.jpg" alt="Track" class="player-thumb">
            <div class="player-info">
                <div class="track-name" id="trackTitle">здесь должна быть музыка, но мне лень</div>
                <div class="track-progress" id="progressContainer">
                    <div class="track-progress-fill" id="progressBar"></div>
                </div>
            </div>
        </div>
    </div>


        </script>

</body>
</html>
